<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="dark">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${mode == 'create' ? 'Create Pricing' : 'Edit Pricing'}">Pricing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body>
<div th:replace="admin/layout :: shell(~{::section})">
    <section>
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-semibold" th:text="${mode == 'create' ? 'Create Pricing' : 'Edit Pricing'}">Pricing</h1>
            <a href="/admin/pricing" class="px-3 py-2 rounded-lg border border-slate-700 text-slate-200 hover:bg-slate-800">Back</a>
        </div>

        <form  th:object="${form}"
               th:action="${mode} == 'create'
           ? @{/admin/pricing}
           : @{/admin/pricing/{id}(id=${form.id})}"
               method="post" class="space-y-4">
            <!-- If you use PUT on update, include method override -->
            <input type="hidden" name="_method" th:value="${mode} == 'create' ? 'POST' : 'PUT'"/>

            <div>
                <label class="block text-sm mb-1">Pricing Name</label>
                <input th:field="*{name}" class="w-full rounded-md border px-3 py-2"/>
                <p class="text-rose-400 text-sm" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm mb-1">Adult Price</label>
                    <input th:field="*{adultPrice}" type="number" step="0.01" class="w-full rounded-md border px-3 py-2"/>
                    <p class="text-rose-400 text-sm" th:if="${#fields.hasErrors('adultPrice')}" th:errors="*{adultPrice}"></p>
                </div>
                <div>
                    <label class="block text-sm mb-1">Child Price</label>
                    <input th:field="*{childPrice}" type="number" step="0.01" class="w-full rounded-md border px-3 py-2"/>
                    <p class="text-rose-400 text-sm" th:if="${#fields.hasErrors('childPrice')}" th:errors="*{childPrice}"></p>
                </div>
            </div>

            <div class="flex gap-2">
                <button type="submit" class="px-4 py-2 rounded-md bg-blue-600 text-white">
                    <span th:text="${mode} == 'create' ? 'Create' : 'Update'">Create</span>
                </button>
                <a href="/admin/pricing" class="px-4 py-2 rounded-md border">Cancel</a>
            </div>
        </form>

    </section>
</div>
</body>
</html>
