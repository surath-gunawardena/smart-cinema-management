<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="dark">
<head>
    <meta charset="UTF-8"/>
    <title>Pricing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body>
<div th:replace="admin/layout :: shell(~{::section})">
    <section>
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-semibold">Pricing</h1>
            <a href="/admin/pricing/new"
               class="px-3 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-500">+ New Pricing</a>
        </div>

        <!-- messages -->
        <div class="space-y-2 mb-4">
            <div th:if="${success}" class="border border-emerald-700/50 bg-emerald-900/40 text-emerald-300 px-4 py-2 rounded-lg" th:text="${success}"></div>
            <div th:if="${error}" class="border border-rose-700/50 bg-rose-900/40 text-rose-300 px-4 py-2 rounded-lg" th:text="${error}"></div>
            <div th:if="${info}" class="border border-blue-700/50 bg-blue-900/40 text-blue-300 px-4 py-2 rounded-lg" th:text="${info}"></div>
        </div>

        <div class="overflow-hidden rounded-xl border border-slate-800">
            <table class="min-w-full text-sm">
                <thead class="bg-slate-800/60 text-slate-300">
                <tr>
                    <th class="px-4 py-3 text-left">ID</th>
                    <th class="px-4 py-3 text-left">Name</th>
                    <th class="px-4 py-3 text-left">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                <tr th:each="p : ${page.content}">
                    <td class="px-4 py-3" th:text="${p.id}">1</td>
                    <td class="px-4 py-3" th:text="${p.name}">Standard</td>
                    <td class="px-4 py-3">
                        <a th:href="@{'/admin/pricing/' + ${p.id} + '/edit'}"
                           class="px-3 py-1.5 rounded-lg border border-slate-700 text-slate-200 hover:bg-slate-800">Edit</a>
                        <form th:action="@{'/admin/pricing/' + ${p.id} + '/delete'}" method="post" class="inline"
                              onsubmit="return confirm('Delete this pricing?');">
                            <button type="submit" class="px-3 py-1.5 rounded-lg border border-rose-700 text-rose-300 hover:bg-rose-900/30">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${page.content.isEmpty()}">
                    <td colspan="3" class="px-4 py-6 text-center text-slate-400">No pricing yet.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- pager -->
        <div class="mt-4 flex items-center gap-2">
            <a th:if="${!page.first}" th:href="@{/admin/pricing(page=${page.number - 1}, size=${page.size})}"
               class="px-3 py-1.5 rounded-lg border border-slate-700 text-slate-200 hover:bg-slate-800">Prev</a>
            <span class="text-slate-400">Page <span th:text="${page.number + 1}">1</span> / <span th:text="${page.totalPages}">1</span></span>
            <a th:if="${!page.last}" th:href="@{/admin/pricing(page=${page.number + 1}, size=${page.size})}"
               class="px-3 py-1.5 rounded-lg border border-slate-700 text-slate-200 hover:bg-slate-800">Next</a>
        </div>
    </section>
</div>
</body>
</html>
