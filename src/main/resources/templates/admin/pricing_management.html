<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:,">
</head>
<body>
<!-- Use the layout and pass our page content as a fragment -->
<div th:replace="~{admin/layout :: shell(~{::section})}">
    <!-- ====== Dashboard Content ====== -->
    <section>
        <h1 class="text-3xl font-bold tracking-tight mb-6">Pricing Management</h1>

        <!-- Section tabs (Movies, Users, Screens, Schedules, Pricing, Reports) -->
<!--        <div class="flex items-center gap-2 overflow-x-auto rounded-xl bg-white border border-slate-200 px-2 py-1 mb-6">-->
            <div class="ml-auto">
                <a href="/admin/pricing/new" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-900 text-white text-sm">
                    <span>+ Add Pricing Rate</span>
                </a>
            </div>
<!--        </div>-->

        <!-- Pricing Management block (like your screenshot) -->
        <div class="mb-6">
            <h2 class="text-2xl font-semibold">Pricing Management</h2>
            <p class="text-slate-500 mb-4">Manage ticket pricing rates and types</p>

            <!-- Standard Rate -->
            <div class="bg-white border border-slate-200 rounded-2xl p-5 mb-4">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <h3 class="text-lg font-semibold">Standard Rate</h3>
                        <span class="px-2 py-0.5 text-xs rounded-full bg-slate-900 text-white">Active</span>
                        <span class="text-xs text-slate-500">Created: <span>11/09/2025</span></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="px-3 py-1.5 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">Deactivate</button>
                        <a href="#" class="px-3 py-1.5 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">Edit</a>
                        <button class="px-3 py-1.5 text-sm rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50">Delete</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div class="rounded-xl border border-slate-200 p-4">
                        <div class="text-slate-500 text-sm">Adult</div>
                        <div class="text-xl font-semibold text-blue-600">$10</div>
                    </div>
                    <div class="rounded-xl border border-slate-200 p-4">
                        <div class="text-slate-500 text-sm">Child</div>
                        <div class="text-xl font-semibold text-blue-600">$5</div>
                    </div>
                </div>
            </div>

            <!-- Premium Rate -->
            <div class="bg-white border border-slate-200 rounded-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <h3 class="text-lg font-semibold">Premium Rate</h3>
                        <span class="px-2 py-0.5 text-xs rounded-full bg-slate-900 text-white">Active</span>
                        <span class="text-xs text-slate-500">Created: <span>11/09/2025</span></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="px-3 py-1.5 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">Deactivate</button>
                        <a href="#" class="px-3 py-1.5 text-sm rounded-lg border border-slate-200 hover:bg-slate-50">Edit</a>
                        <button class="px-3 py-1.5 text-sm rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50">Delete</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div class="rounded-xl border border-slate-200 p-4">
                        <div class="text-slate-500 text-sm">Adult</div>
                        <div class="text-xl font-semibold text-blue-600">$15</div>
                    </div>
                    <div class="rounded-xl border border-slate-200 p-4">
                        <div class="text-slate-500 text-sm">Child</div>
                        <div class="text-xl font-semibold text-blue-600">$8</div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
